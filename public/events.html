<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khám phá sự kiện – NEU Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/img/favicon-neu.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* ===== Bổ sung khi nối dữ liệu ===== */
  .ev-count { font-size: 14.5px; color: var(--muted); }
  .ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .ev-card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; transition: border-color .15s, box-shadow .15s, transform .15s; }
  .ev-card:hover { border-color: #c5d4ea; box-shadow: 0 10px 30px rgba(15,42,92,.08); transform: translateY(-2px); }
  .ev-cover { position: relative; height: 120px; background: center / cover no-repeat; }
  .ev-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,42,92,0) 30%, rgba(12,36,84,.55)); }
  .ev-cover .tags { position: absolute; left: 14px; top: 12px; display: flex; gap: 6px; z-index: 1; }
  .ev-cover .tags .st { background: rgba(255,255,255,.92); }
  .ev-cover .date { position: absolute; right: 14px; bottom: 10px; z-index: 1; text-align: center; color: #fff; }
  .ev-cover .date b { display: block; font-size: 22px; line-height: 1; }
  .ev-cover .date small { font-size: 13.5px; text-transform: uppercase; letter-spacing: .4px; opacity: .9; }
  .ev-body { padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .ev-body h3 { font-size: 17px; font-weight: 600; line-height: 1.4; color: var(--ink); }
  .ev-meta { display: flex; flex-direction: column; gap: 6px; font-size: 14.5px; color: var(--text); }
  .ev-meta div { display: flex; gap: 8px; align-items: flex-start; }
  .ev-meta svg { width: 13px; height: 13px; color: var(--muted); margin-top: 1px; }
  .ev-foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .seats { flex: 1; font-size: 14px; color: var(--muted); }
  .seats .bar { height: 4px; border-radius: 2px; background: #e5eaf3; margin-top: 5px; overflow: hidden; }
  .seats .bar i { display: block; height: 100%; background: var(--blue); }
</style>
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/enhance.css">
<link rel="stylesheet" href="/css/events-home.css">
</head>
<body>

<!-- Sidebar & header được dựng bởi /js/app.js theo tài khoản đăng nhập -->
<aside class="sidebar" aria-label="Điều hướng chính"></aside>
<div class="scrim" id="scrim"></div>
<header class="header"></header>

<div class="main">
  <main class="container">
    <!-- 1. Dải nổi bật: sự kiện tiêu điểm (trượt) + lịch tháng -->
    <section class="fband" id="fband">
      <div class="fslider" id="slider" aria-roledescription="carousel" aria-label="Sự kiện tiêu điểm">
        <div class="fs-track" id="slides"><div class="skel-slide"></div></div>
        <button class="fs-nav prev" id="sPrev" aria-label="Sự kiện trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button>
        <button class="fs-nav next" id="sNext" aria-label="Sự kiện tiếp theo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <div class="fs-dots" id="sDots"></div>
      </div>
      <aside class="mcal" id="mcal" aria-label="Lịch sự kiện theo tháng">
        <div class="mc-head">
          <b id="mcTitle"></b>
          <div class="mc-nav">
            <button id="mcPrev" aria-label="Tháng trước"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button id="mcToday" class="mc-today">Hôm nay</button>
            <button id="mcNext" aria-label="Tháng sau"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
          </div>
        </div>
        <div class="mc-grid" id="mcGrid"></div>
        <div class="mc-legend"><span><i class="lg-mine"></i><em id="mcMineLbl">Bạn đã đăng ký</em></span><span><i class="lg-has"></i>Có sự kiện</span></div>
        <div class="mc-peek" id="mcPeek"></div>
      </aside>
    </section>

    <!-- 2. Sự kiện sắp diễn ra (trượt ngang) -->
    <section class="sec" id="upSec" hidden>
      <div class="sec-head">
        <h2>Sự kiện sắp diễn ra</h2>
        <div class="sec-arrows"><button id="upPrev" aria-label="Lùi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></button><button id="upNext" aria-label="Tiếp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
      </div>
      <div class="hrow" id="upRow"></div>
    </section>

    <!-- 3. Tất cả sự kiện + bộ lọc -->
    <section class="sec" id="allSec">
      <div class="sec-head">
        <div><h2>Tất cả sự kiện</h2><p class="ev-count" id="count"></p></div>
        <div class="head-actions" id="headActions"></div>
      </div>

      <div class="card fcard">
        <div class="tabs" role="tablist" id="tabs" style="margin-top:0">
          <button class="tab active" data-phase="">Tất cả</button>
          <button class="tab" data-phase="open">Đang mở đăng ký</button>
          <button class="tab" data-phase="ongoing">Đang diễn ra</button>
          <button class="tab" data-phase="upcoming">Sắp diễn ra</button>
          <button class="tab" data-phase="ended">Đã kết thúc</button>
        </div>
        <div class="filters" style="margin-bottom:0">
          <div class="search">
            <input type="text" id="search" placeholder="Tìm tên sự kiện, mã sự kiện…">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
          </div>
          <select class="select" id="category" aria-label="Loại sự kiện"><option value="">Tất cả loại</option></select>
          <select class="select" id="unit" aria-label="Đơn vị"><option value="">Tất cả đơn vị</option></select>
        </div>
        <div class="quick">
          <div class="chips" id="dateChips" role="group" aria-label="Lọc theo thời gian">
            <span class="lbl">Thời gian</span>
            <button class="chip on" data-when="">Mọi lúc</button>
            <button class="chip" data-when="today">Hôm nay</button>
            <button class="chip" data-when="week">7 ngày tới</button>
            <button class="chip" data-when="weekend">Cuối tuần này</button>
            <button class="chip" data-when="month">Tháng này</button>
            <button class="chip" data-when="seats" title="Chỉ hiện sự kiện còn mở đăng ký và còn chỗ">Còn chỗ</button>
          </div>
          <div class="chips" id="catChips" role="group" aria-label="Lọc theo chủ đề"><span class="lbl">Chủ đề</span></div>
        </div>
      </div>

      <div class="toolbar">
        <div><span class="day-pill" id="dayPill" hidden></span></div>
        <div style="display:flex;gap:14px;align-items:center">
          <a class="link-reset" id="resetBtn" href="#" hidden>Xóa bộ lọc</a>
          <div class="view-switch" role="group" aria-label="Kiểu hiển thị">
            <button data-view="grid" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Lưới</button>
            <button data-view="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M7 14h4M7 18h7"/></svg>Theo ngày</button>
          </div>
        </div>
      </div>
      <section class="ev-grid" id="grid"></section>
    </section>

  </main>
  <footer class="footer"></footer>
</div>

<script src="/js/app.js"></script>
<script src="/js/pages/events.js"></script>
</body>
</html>
