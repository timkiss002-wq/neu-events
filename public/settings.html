<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cấu hình hệ thống – NEU Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/img/favicon-neu.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/enhance.css">
<link rel="stylesheet" href="/css/system.css">
</head>
<body>

<!-- Sidebar & header được dựng bởi /js/app.js theo tài khoản đăng nhập -->
<aside class="sidebar" aria-label="Điều hướng chính"></aside>
<div class="scrim" id="scrim"></div>
<header class="header"></header>

<div class="main">
  <main class="container">
    <div class="crumbs">NEU Events <span>/</span> Quản trị hệ thống <span>/</span> <b>Cấu hình hệ thống</b></div>
    <div class="page-head">
      <div>
        <h1>Cấu hình hệ thống</h1>
        <p>Thiết lập tham số dùng chung cho toàn hệ thống. Thay đổi có hiệu lực ngay và được ghi vào nhật ký.</p>
      </div>
      <div class="head-actions">
        <button class="btn-outline" id="resetBtn">Khôi phục mặc định</button>
      </div>
    </div>
    <div id="banner"></div>
    <div id="groups"><div class="loading"><span class="spinner"></span></div></div>
    <div class="save-bar" id="saveBar" hidden>
      <div class="hint" id="saveHint">Có thay đổi chưa lưu.</div>
      <div class="cell-actions"><button class="btn-outline" id="undoBtn">Hủy thay đổi</button><button class="btn-primary" id="saveBtn">Lưu cấu hình</button></div>
    </div>

  </main>
  <footer class="footer"></footer>
</div>

<script src="/js/app.js"></script>
<script src="/js/pages/settings.js"></script>
</body>
</html>
