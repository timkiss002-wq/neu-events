<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hồ sơ cá nhân – NEU Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/img/favicon-neu.png" type="image/png">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* ===== Bổ sung khi nối dữ liệu ===== */
  .pf { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
  .pf .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .pf-card { text-align: center; }
  .pf-card .big-av { width: 72px; height: 72px; border-radius: 50%; margin: 6px auto 14px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-size: 24px; font-weight: 700; }
  .pf-card h3 { font-size: 19px; }
  .pf-card dl { text-align: left; margin-top: 18px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
  .pf-card dt { font-size: 13.5px; text-transform: uppercase; letter-spacing: .3px; color: var(--muted); }
  .pf-card dd { font-size: 15px; font-weight: 500; margin-top: 4px; }
  #password { scroll-margin-top: calc(var(--header-h) + 16px); }
  .act-list { display: flex; flex-direction: column; margin-top: 12px; }
  .act-list div { padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--text); line-height: 1.45; }
  .act-list div:last-child { border-bottom: 0; }
  .act-list small { display: block; color: var(--muted); font-size: 14px; margin-top: 3px; }
  @media (max-width: 960px) { .pf { grid-template-columns: 1fr; } }
</style>
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/enhance.css">
</head>
<body>

<!-- Sidebar & header được dựng bởi /js/app.js theo tài khoản đăng nhập -->
<aside class="sidebar" aria-label="Điều hướng chính"></aside>
<div class="scrim" id="scrim"></div>
<header class="header"></header>

<div class="main">
  <main class="container">
    <div class="crumbs">NEU Events <span>/</span> <b>Hồ sơ cá nhân</b></div>
    <div class="page-head"><div><h1>Hồ sơ cá nhân</h1><p>Thông tin tài khoản, liên hệ và bảo mật.</p></div></div>

    <div class="pf">
      <div class="col">
        <section class="card pf-card" id="who"></section>
        <section class="card"><h3>Hoạt động gần đây</h3><div class="hint">Nhật ký thao tác của tài khoản</div><div class="act-list" id="activity"></div></section>
      </div>
      <div class="col">
        <section class="stats s3" id="stats"></section>
        <section class="card">
          <h3>Thông tin liên hệ</h3>
          <div class="hint">Họ tên, MSSV/mã cán bộ và đơn vị do nhà trường quản lý.</div>
          <form id="infoForm" class="form-grid" style="margin-top:16px" novalidate>
            <div><label class="label">Email</label><input class="inp" name="email" type="email" required></div>
            <div><label class="label">Số điện thoại</label><input class="inp" name="phone"></div>
            <div class="full"><div id="infoAlert"></div><button class="btn-primary" type="submit">Lưu thông tin</button></div>
          </form>
        </section>
        <section class="card" id="password">
          <h3>Đổi mật khẩu</h3>
          <div class="hint">Mật khẩu tối thiểu 6 ký tự.</div>
          <form id="pwForm" class="form-grid" style="margin-top:16px" novalidate>
            <div class="full"><label class="label">Mật khẩu hiện tại</label><input class="inp" name="current" type="password" autocomplete="current-password" required></div>
            <div><label class="label">Mật khẩu mới</label><input class="inp" name="password" type="password" autocomplete="new-password" required minlength="6"></div>
            <div><label class="label">Nhập lại mật khẩu mới</label><input class="inp" name="confirm" type="password" autocomplete="new-password" required></div>
            <div class="full"><div id="pwAlert"></div><button class="btn-primary" type="submit">Đổi mật khẩu</button></div>
          </form>
        </section>
      </div>
    </div>

  </main>
  <footer class="footer"></footer>
</div>

<script src="/js/app.js"></script>
<script src="/js/pages/profile.js"></script>
</body>
</html>
